<!doctype html>
<!-- 사주 쇼츠 영상 템플릿: make.mjs 가 글꼴 경로와 장면(SCENES 자리)을 채운 뒤 프레임마다 render(t) 를 호출해 캡처한다. -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="{{FONTS}}/noto-sans-kr/500.css">
<link rel="stylesheet" href="{{FONTS}}/noto-sans-kr/700.css">
<link rel="stylesheet" href="{{FONTS}}/noto-sans-kr/900.css">
<link rel="stylesheet" href="{{FONTS}}/gowun-batang/700.css">
<link rel="stylesheet" href="{{FONTS}}/noto-serif-kr/900.css">
<style>
:root { --bg1:#10142a; --bg2:#25325f; --paper:#f4efe4; --muted:#aeb3cc; --seal:#e0533b;
  --wood:#5fbf7a; --fire:#f0705a; --earth:#e2b04f; --metal:#c9ced8; --water:#6f9cf0; --gold:#f2cf7a;
  --d:'Gowun Batang','Noto Serif KR',serif; --h:'Noto Serif KR',serif; --b:'Noto Sans KR',sans-serif }
* { box-sizing:border-box; margin:0 }
html,body { width:1080px; height:1920px; overflow:hidden; background:var(--bg1) }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; color:var(--paper); font-family:var(--b);
  background: radial-gradient(1200px 900px at 50% 30%, var(--bg2), var(--bg1) 70%) }
#moon { position:absolute; width:520px; height:520px; border-radius:50%; right:-140px; top:-120px;
  background: radial-gradient(circle at 40% 40%, rgba(244,239,228,.22), rgba(244,239,228,.04) 60%, transparent 70%) }
#wm { position:absolute; left:50%; top:52%; font-family:var(--h); font-weight:900; font-size:760px; line-height:1; color:rgba(255,255,255,.035); transform:translate(-50%,-50%); white-space:nowrap }
.star { position:absolute; width:4px; height:4px; border-radius:50%; background:var(--paper) }
.scene { position:absolute; inset:0; padding:220px 90px 440px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; text-align:center; opacity:0 }
.a { opacity:0 }
.eyebrow { font-size:38px; letter-spacing:.18em; color:var(--gold); font-weight:700 }
.big { font-family:var(--d); font-weight:700; font-size:92px; line-height:1.25; word-break:keep-all }
.mid { font-family:var(--d); font-weight:700; font-size:66px; line-height:1.3; word-break:keep-all }
.txt { font-size:44px; line-height:1.55; color:var(--paper); word-break:keep-all; font-weight:500 }
.muted { color:var(--muted) }
.seal { width:230px; height:230px; border:8px solid var(--seal); color:var(--seal); border-radius:26px; display:grid; place-items:center;
  font-family:var(--h); font-weight:900; font-size:84px; line-height:1.05; transform:rotate(-5deg) }
.hl { color:var(--gold) }
.pillars { display:flex; gap:22px; margin-top:20px }
.col { display:flex; flex-direction:column; gap:16px; align-items:center }
.col .lab { font-size:34px; color:var(--muted); font-weight:700 }
.g { width:190px; height:190px; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#141a2e }
.g b { font-family:var(--h); font-weight:900; font-size:120px; line-height:1 }
.g i { font-style:normal; font-size:30px; font-weight:700; margin-top:4px }
.e0{background:var(--wood)} .e1{background:var(--fire)} .e2{background:var(--earth)} .e3{background:var(--metal)} .e4{background:var(--water)}
.c0{color:var(--wood)} .c1{color:var(--fire)} .c2{color:var(--earth)} .c3{color:var(--metal)} .c4{color:var(--water)}
.me { box-shadow:0 0 0 8px var(--paper), 0 0 60px 10px rgba(242,207,122,.6) }
.date { font-size:46px; font-weight:700; padding:18px 34px; border:2px solid rgba(244,239,228,.35); border-radius:999px }
.arrow { font-size:40px; color:var(--muted) }
.hero-g { width:360px; height:360px; border-radius:40px }
.hero-g b { font-size:240px } .hero-g i { font-size:44px }
.bars { width:100%; display:flex; flex-direction:column; gap:30px; margin-top:20px }
.bar { display:grid; grid-template-columns:150px 1fr 110px; gap:24px; align-items:center; font-size:48px; font-weight:900 }
.track { height:46px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden }
.track span { display:block; height:100%; width:0; border-radius:99px }
.n { text-align:right; font-variant-numeric:tabular-nums }
.alert { font-size:52px; font-weight:900; padding:24px 40px; border-radius:20px; background:rgba(240,112,90,.16); color:var(--fire); word-break:keep-all }
.cards { width:100%; display:flex; flex-direction:column; gap:26px }
.card { text-align:left; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.12); border-radius:26px; padding:30px 36px; display:flex; gap:28px; align-items:center }
.card .k { flex:none; font-family:var(--h); font-weight:900; font-size:76px; width:150px; text-align:center }
.card .v { font-size:40px; line-height:1.45; font-weight:500; word-break:keep-all }
.card .v b { display:block; font-size:46px; font-weight:900 }
.badge { display:inline-block; font-size:34px; font-weight:900; padding:4px 18px; border-radius:10px; color:#141a2e; margin-left:10px; vertical-align:middle }
.up{background:var(--wood)} .mid-b{background:var(--metal)} .down{background:var(--fire)}
.lucky { display:grid; grid-template-columns:1fr 1fr; gap:24px; width:100% }
.lucky div { background:rgba(111,156,240,.14); border:2px solid rgba(111,156,240,.4); border-radius:26px; padding:34px 20px }
.lucky span { display:block; font-size:34px; color:var(--muted); font-weight:700 }
.lucky b { display:block; font-size:54px; font-weight:900; margin-top:8px; word-break:keep-all }
.swatch { display:inline-block; width:46px; height:46px; border-radius:50%; vertical-align:-6px; margin-right:6px; border:3px solid rgba(255,255,255,.5) }
.cta { font-size:46px; font-weight:900; background:var(--paper); color:#141a2e; padding:28px 54px; border-radius:999px }
#bar { position:absolute; left:0; top:0; height:10px; background:var(--gold); width:0 }
#tag { position:absolute; left:90px; top:120px; font-size:30px; color:var(--muted); letter-spacing:.1em; font-weight:700 }
</style></head>
<body><div id="stage">
<div id="moon"></div><div id="wm">命</div><div id="stars"></div>
<div id="bar"></div><div id="tag">四柱八字 · 사주 명식</div>

<!--SCENES-->
</div>
<script>
const DURATION = 30
const clamp = (x) => Math.max(0, Math.min(1, x))
const easeOut = (x) => 1 - Math.pow(1 - x, 3)
const easeBack = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
// 별: 고정 시드
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
const stars = document.getElementById('stars'); const SL = []
for (let i = 0; i < 70; i++) { const s = document.createElement('i'); s.className = 'star'; s.style.left = rnd() * 1080 + 'px'; s.style.top = rnd() * 1920 + 'px'; const sz = 2 + rnd() * 4; s.style.width = s.style.height = sz + 'px'; stars.appendChild(s); SL.push([s, rnd() * 6.28, .5 + rnd()]) }
const scenes = [...document.querySelectorAll('.scene')]
window.render = function (t) {
  document.getElementById('bar').style.width = (t / DURATION) * 100 + '%'
  document.getElementById('wm').style.transform = `translate(-50%,-50%) translateY(${-t * 6}px) rotate(${t * .3}deg)`
  for (const [s, ph, sp] of SL) s.style.opacity = .15 + .5 * (0.5 + 0.5 * Math.sin(t * sp * 2 + ph))
  for (const sc of scenes) {
    const s = +sc.dataset.s, e = +sc.dataset.e
    const vis = t >= s - .01 && t < e
    const out = clamp((e - t) / .35)
    sc.style.opacity = vis ? out : 0
    if (!vis) continue
    const lt = t - s
    sc.style.transform = `translateY(${(1 - out) * -40}px)`
    for (const el of sc.querySelectorAll('.a')) {
      const p = clamp((lt - +el.dataset.t) / .5), q = easeOut(p)
      const fx = el.dataset.fx
      el.style.opacity = p > 0 ? Math.min(1, p * 2) : 0
      if (fx === 'stamp') el.style.transform = `rotate(-5deg) scale(${1 + (1 - easeOut(clamp((lt - +el.dataset.t) / .35))) * 1.6})`
      else if (fx === 'drop') el.style.transform = `translateY(${(1 - easeBack(p)) * -160}px)`
      else if (fx === 'zoom') el.style.transform = `scale(${.4 + .6 * easeBack(p)})`
      else if (fx === 'pop') el.style.transform = `scale(${.6 + .4 * easeBack(p)})`
      else if (fx === 'slide') el.style.transform = `translateX(${(1 - q) * 120}px)`
      else el.style.transform = `translateY(${(1 - q) * 46}px)`
    }
    for (const el of sc.querySelectorAll('[data-w]')) el.style.width = +el.dataset.w * easeOut(clamp((lt - +el.dataset.bt) / 1.0)) + '%'
    for (const el of sc.querySelectorAll('[data-n]')) el.textContent = Math.round(+el.dataset.n * easeOut(clamp((lt - +el.dataset.bt) / 1.0)))
  }
}
render(0)
</script></body></html>
