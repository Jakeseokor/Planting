<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="타이어 수첩" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
<title>타이어 수첩</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#15181d; --sub:#5d6573; --line:#e3e6eb;
  --accent:#2563eb; --accent-ink:#fff;
  --ok:#15803d; --ok-bg:#e8f6ed;
  --warn:#b45309; --warn-bg:#fdf3e2;
  --bad:#c62828; --bad-bg:#fdecec;
  --info:#1d4ed8; --info-bg:#e9effd;
  --track:#e9ecf1;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --card:#1a1e24; --ink:#eef1f5; --sub:#9aa3b1; --line:#2a3039;
    --accent:#5b8cff; --accent-ink:#0b1020;
    --ok:#4ade80; --ok-bg:#163021;
    --warn:#fbbf24; --warn-bg:#33270f;
    --bad:#f87171; --bad-bg:#3a1a1a;
    --info:#93b4ff; --info-bg:#1a2540;
    --track:#2a3039;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --card:#1a1e24; --ink:#eef1f5; --sub:#9aa3b1; --line:#2a3039;
  --accent:#5b8cff; --accent-ink:#0b1020;
  --ok:#4ade80; --ok-bg:#163021; --warn:#fbbf24; --warn-bg:#33270f;
  --bad:#f87171; --bad-bg:#3a1a1a; --info:#93b4ff; --info-bg:#1a2540; --track:#2a3039;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 24px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 0 4px}
header.top h1{font-size:22px;margin:0;letter-spacing:-.02em}
header.top .odo{color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums}
h2{font-size:15px;color:var(--sub);font-weight:600;margin:20px 0 8px;letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stack>*+*{margin-top:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--sub)}
.small{font-size:13px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:15px}
.alert b{display:block}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.alert.bad{background:var(--bad-bg);color:var(--bad)} .alert.bad .ic{background:var(--bad);color:var(--bad-bg)}
.alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.warn .ic{background:var(--warn);color:var(--warn-bg)}
.alert.info{background:var(--info-bg);color:var(--info)} .alert.info .ic{background:var(--info);color:var(--info-bg)}
.alert.ok{background:var(--ok-bg);color:var(--ok)} .alert.ok .ic{background:var(--ok);color:var(--ok-bg)}
.alert span.d{display:block;color:var(--ink);opacity:.8;font-size:13px}

.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:end}
.next .big{font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.next .left{font-size:14px;color:var(--sub)}
.next .right{text-align:right}

.car{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.pos{position:relative}
.pos .lab{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.pair-head{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.chip{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:800;font-size:17px}
.pair-head .meta{flex:1;min-width:0}
.pair-head .meta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--bg);border-radius:10px;padding:8px}
.kv small{display:block;color:var(--sub);font-size:11px}
.kv b{font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.danger{color:var(--bad)}
button:active{transform:scale(.98)}

table.plan{width:100%;border-collapse:collapse;font-size:14px}
table.plan td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
table.plan tr:first-child td{border-top:0}
table.plan td.r{text-align:right;white-space:nowrap}

.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--sub)}
.ev .dot.rotate{background:var(--accent)} .ev .dot.abnormal{background:var(--bad)} .ev .dot.tread{background:var(--ok)} .ev .dot.install{background:var(--warn)}
.ev .t{font-weight:600}
.ev .s{font-size:13px;color:var(--sub)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;max-width:240px;border:0;border-radius:0;background:none;color:var(--sub);padding:12px 0 14px;font-size:14px}
nav.tabs button.on{color:var(--accent)}

dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink);max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px 16px 16px}
dialog h3{margin:0 0 4px;font-size:19px}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--sub);font-weight:600}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1}
.box{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.box ol{margin:4px 0 0;padding-left:20px}
.err{color:var(--bad);font-size:13px;min-height:1em;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
@media (min-width:640px){ .car{grid-template-columns:repeat(2,minmax(0,1fr))} .actions{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="home" class="on">현황</button>
  <button data-tab="log">이력</button>
  <button data-tab="set">설정</button>
</nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= 저장 ================= */
const KEY = 'evtire.v1', HKEY = 'evtire.hist.v1';
const DEF_SETTINGS = {
  stageKm: 40000,      // 앞/뒤 각 단계 거리
  treadLimit: 3.0,     // 이하 즉시 교체
  treadCaution: 4.0,   // 이하 주의
  treadInterval: 10000,// 트레드 점검 주기
  dotCaution: 5, dotWarn: 6, // 제조 후 연수
  soonKm: 3000,        // 위치교환 임박 알림 거리
  monthlyKm: 1500      // 주행 기록이 부족할 때 쓰는 월 평균 주행거리
};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
let S = null;
try{ S = JSON.parse(lsGet(KEY) || 'null'); }catch(e){ S = null; }
if (S) S.settings = Object.assign({}, DEF_SETTINGS, S.settings || {});
function dropScrapAt(){ if (S) S.pairs.forEach(p => { delete p.scrapAtOdo; }); } // 이전 버전의 '뒤 사용 한도 예외' 제거
dropScrapAt();
function save(){ if(!lsSet(KEY, JSON.stringify(S))) toast('저장 실패: 브라우저 저장소를 확인하세요'); }
function snapshot(){
  let h = []; try{ h = JSON.parse(lsGet(HKEY) || '[]'); }catch(e){}
  h.push(JSON.stringify(S)); if (h.length > 20) h = h.slice(-20);
  lsSet(HKEY, JSON.stringify(h));
}
function undo(){
  let h = []; try{ h = JSON.parse(lsGet(HKEY) || '[]'); }catch(e){}
  if (!h.length) return toast('되돌릴 작업이 없습니다');
  S = JSON.parse(h.pop()); lsSet(HKEY, JSON.stringify(h)); save(); render(); toast('마지막 작업을 되돌렸습니다');
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const km = n => Math.round(n).toLocaleString('ko-KR') + ' km';
const pad = n => String(n).padStart(2,'0');
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtD(d){ return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()); }
function fmtS(s){ return s ? fmtD(parseD(s)) : '-'; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + Math.round(n)); return x; }
function addYears(d, n){ const x = new Date(d); x.setFullYear(x.getFullYear() + n); return x; }
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2200); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* DOT 4자리(WWYY) → 제조 주의 월요일 */
function dotDate(dot){
  if (!/^\d{4}$/.test(dot || '')) return null;
  const w = +dot.slice(0,2), y = 2000 + +dot.slice(2);
  if (w < 1 || w > 53) return null;
  const s = new Date(y, 0, 1 + (w-1)*7), dow = s.getDay() || 7;
  const d = addDays(s, dow <= 4 ? 1 - dow : 8 - dow);
  return d.getTime() > Date.now() + 7*864e5 ? null : d; // 미래 제조일은 오입력으로 처리
}
function ageYears(d){ return (Date.now() - d.getTime()) / (365.2425*864e5); }

/* ================= 도메인 로직 ================= */
const st = () => S.settings;
const mounted = pos => S.pairs.find(p => p.status === pos);
function nextId(offset = 0){
  const ids = S.pairs.map(p => p.id);
  let n = 0; ids.forEach(id => { const v = idNum(id); if (v > n) n = v; });
  return numId(n + 1 + offset);
}
function idNum(id){ let n = 0; for (const c of id) n = n*26 + (c.charCodeAt(0) - 64); return n; }
function numId(n){ let s = ''; while (n > 0){ const r = (n-1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n-1)/26); } return s; }

function run(p){ return (p.status==='front' || p.status==='rear') ? Math.max(0, S.odo - p.posStartOdo) : 0; }
function used(p){
  const r = run(p);
  const front = p.frontKm + (p.status==='front' ? r : 0);
  const rear  = p.rearKm  + (p.status==='rear'  ? r : 0);
  return { front, rear, total: front + rear };
}
function fold(p){ const r = run(p); if (p.status==='front') p.frontKm += r; else if (p.status==='rear') p.rearKm += r; p.posStartOdo = S.odo; }
function frontTarget(p){ return p.posStartOdo + (st().stageKm - p.frontKm); }
function rearTarget(p){ return p.posStartOdo + (st().stageKm - p.rearKm); } // 뒤에서는 4만 km까지만
function lastTread(p){ return p.tread && p.tread.length ? p.tread[p.tread.length-1] : null; }

/* 평균 주행 속도(km/일) */
function kmPerDay(){
  const L = S.odoLog;
  if (L.length >= 2){
    const a = L[0], b = L[L.length-1];
    const days = (parseD(b.date) - parseD(a.date)) / 864e5;
    if (days >= 14 && b.odo > a.odo) return (b.odo - a.odo) / days;
  }
  return st().monthlyKm / 30.44;
}
function estDate(targetOdo){
  const last = S.odoLog[S.odoLog.length-1];
  const base = parseD(last.date);
  const d = addDays(base, Math.max(0, (targetOdo - last.odo) / kmPerDay()));
  const t = parseD(todayStr());
  return d < t ? t : d;
}

/* 위치교환 판단 규칙
   - 각 쌍은 앞에서 최대 4만 km, 뒤에서 최대 4만 km만 쓴다.
   - 위치교환 시점 = 앞 타이어가 앞 4만 km 또는 뒤 타이어가 뒤 4만 km에 닿는 시점 중 먼저 오는 쪽.
   - 뒤 타이어가 뒤 4만 km에 닿았는데 앞을 한 번도 쓰지 않았다면(예: 지금의 B) 앞으로 올려 4만 km 더 쓰고,
     앞 타이어는 뒤로 내린다(폐기·신품 없음).
   - 그 밖에는 기본 규칙: 뒤 폐기 → 앞을 뒤로 → 신품을 앞에. 갈 자리가 없는 쌍은 폐기하고 빈자리는 신품. */
function decide(f, r, at){
  const s = st().stageKm;
  const fFront = f.frontKm + (at - f.posStartOdo), rRear = r.rearKm + (at - r.posStartOdo);
  const fEx = fFront >= s, rEx = rRear >= s;
  const rCanFront = r.frontKm === 0;   // 앞을 한 번도 안 쓴 뒤 타이어
  const fCanRear = f.rearKm < s;       // 뒤 사용 여유가 있는 앞 타이어
  let fTo, rTo;
  if (rEx && rCanFront){ rTo = 'front'; fTo = fCanRear ? 'rear' : 'scrap'; }
  else if (rEx){ rTo = 'scrap'; fTo = fCanRear ? 'rear' : (fEx ? 'scrap' : 'front'); }
  else if (fCanRear){ fTo = 'rear'; rTo = rCanFront ? 'front' : 'scrap'; }
  else { fTo = 'scrap'; rTo = 'rear'; }
  const newFront = fTo !== 'front' && rTo !== 'front';
  const newRear  = fTo !== 'rear'  && rTo !== 'rear';
  return { fTo, rTo, newFront, newRear, fEx, rEx };
}
function describe(d, fId, rId, nfId, nrId){
  const a = [];
  if (d.rTo === 'scrap') a.push(`${rId} 폐기`);
  if (d.fTo === 'scrap') a.push(`${fId} 폐기`);
  if (d.rTo === 'front') a.push(`${rId} 뒤→앞`);
  if (d.fTo === 'rear')  a.push(`${fId} 앞→뒤`);
  if (d.fTo === 'front') a.push(`${fId} 앞 유지`);
  if (d.rTo === 'rear')  a.push(`${rId} 뒤 유지`);
  if (nfId) a.push(`신품 ${nfId} → 앞`);
  if (nrId) a.push(`신품 ${nrId} → 뒤`);
  return a;
}
function whyText(d, fId, rId){
  const S4 = km(st().stageKm), w = [];
  if (d.fEx) w.push(`앞 ${fId}가 앞에서 ${S4}`);
  if (d.rEx) w.push(`뒤 ${rId}가 뒤에서 ${S4}`);
  return w.join(' · ') + ' 도달';
}
/* 다음 위치교환 + 이후 일정 시뮬레이션 */
function schedule(){
  const f = mounted('front'), r = mounted('rear');
  if (!f || !r) return null;
  const s = st().stageKm;
  const cp = p => ({ id: p.id, frontKm: p.frontKm, rearKm: p.rearKm, posStartOdo: p.posStartOdo });
  let vf = cp(f), vr = cp(r), k = 0;
  const plan = [];
  for (let i = 0; i < 4; i++){
    const ft = vf.posStartOdo + s - vf.frontKm, rt = vr.posStartOdo + s - vr.rearKm;
    const at = Math.min(ft, rt);
    const d = decide(vf, vr, at);
    const nf = d.newFront ? { id: nextId(k++), frontKm: 0, rearKm: 0, posStartOdo: at } : null;
    const nr = d.newRear  ? { id: nextId(k++), frontKm: 0, rearKm: 0, posStartOdo: at } : null;
    plan.push({ odo: at, d, steps: describe(d, vf.id, vr.id, nf && nf.id, nr && nr.id), reason: whyText(d, vf.id, vr.id),
      scrap: [d.fTo === 'scrap' && vf.id, d.rTo === 'scrap' && vr.id].filter(Boolean), newCount: (nf ? 1 : 0) + (nr ? 1 : 0) });
    vf.frontKm += at - vf.posStartOdo; vf.posStartOdo = at;
    vr.rearKm  += at - vr.posStartOdo; vr.posStartOdo = at;
    const nextF = d.rTo === 'front' ? vr : d.fTo === 'front' ? vf : nf;
    const nextR = d.fTo === 'rear'  ? vf : d.rTo === 'rear'  ? vr : nr;
    vf = nextF; vr = nextR;
  }
  return { f, r, next: plan[0].odo, reason: plan[0].reason, plan };
}

/* 알림 계산 (조기 교체 조건이 km보다 우선) */
function alerts(){
  const A = [], s = st(), sc = schedule();
  ['front','rear'].forEach(pos => {
    const p = mounted(pos); if (!p) return;
    const nm = `${pos==='front'?'앞':'뒤'} ${p.id}`;
    const t = lastTread(p);
    if (t && t.mm <= s.treadLimit) A.push({lv:'bad', t:`${nm} 트레드 ${t.mm.toFixed(1)}mm — 즉시 교체`, d:`기준 ${s.treadLimit.toFixed(1)}mm 이하. km 일정보다 우선합니다. '비정상 교체'로 기록하세요.`});
    else if (t && t.mm <= s.treadCaution) A.push({lv:'warn', t:`${nm} 트레드 ${t.mm.toFixed(1)}mm — 주의`, d:`${s.treadLimit.toFixed(1)}mm에 가까워지고 있습니다. 점검 간격을 줄이세요.`});
    if (!t) A.push({lv:'info', t:`${nm} 트레드 측정값 없음`, d:'기준값을 위해 한 번 측정해 두세요.'});
    const md = dotDate(p.dot);
    if (md){
      const age = ageYears(md);
      if (age >= s.dotWarn) A.push({lv:'bad', t:`${nm} 제조 ${age.toFixed(1)}년 경과 — 교체`, d:`DOT ${p.dot} · ${s.dotWarn}년 기준 초과. km 일정보다 우선합니다.`});
      else if (age >= s.dotCaution) A.push({lv:'warn', t:`${nm} 제조 ${age.toFixed(1)}년 경과 — 주의`, d:`DOT ${p.dot} · ${fmtD(addYears(md, s.dotWarn))}에 ${s.dotWarn}년 도달`});
      else if (sc){
        const exit = sc.plan.find(x => x.scrap.includes(p.id))?.odo; // 이 쌍이 폐기될 예상 주행거리
        if (exit != null){
          const exitD = estDate(exit), lim = addYears(md, s.dotWarn);
          if (lim < exitD) A.push({lv:'info', t:`${nm}: km보다 연식 한도가 먼저 옵니다`, d:`${s.dotWarn}년 도달 ${fmtD(lim)} · km 기준 폐기 예상 ${fmtD(exitD)}`});
        }
      }
    } else A.push({lv:'info', t:`${nm} 제조일(DOT) 미입력`, d:'연식 경고를 받으려면 타이어 측면 DOT 끝 4자리를 입력하세요.'});
  });
  if (sc){
    const left = sc.next - S.odo;
    if (left <= 0) A.push({lv:'bad', t:`위치교환 시점 ${left===0?'도달':km(-left)+' 초과'}`, d:sc.reason});
    else if (left <= s.soonKm) A.push({lv:'warn', t:`위치교환 ${km(left)} 남음`, d:`${km(sc.next)} · 예상 ${fmtD(estDate(sc.next))}`});
  }
  const tLeft = S.lastTreadOdo + s.treadInterval - S.odo;
  if (tLeft <= 0) A.push({lv:'warn', t:'트레드 점검 시기입니다', d:`마지막 점검 ${km(S.lastTreadOdo)} 이후 ${km(S.odo - S.lastTreadOdo)} 주행`});
  const last = S.odoLog[S.odoLog.length-1];
  const stale = (parseD(todayStr()) - parseD(last.date)) / 864e5;
  if (stale > 30) A.push({lv:'info', t:`주행거리 업데이트 ${Math.floor(stale)}일 전`, d:'계기판 km를 입력하면 일정 예측이 정확해집니다.'});
  const ord = {bad:0, warn:1, info:2};
  return A.sort((a,b) => ord[a.lv] - ord[b.lv]);
}

/* ================= 상태 변경 ================= */
function logEv(type, date, odo, title, detail){ S.events.push({ id: uid(), type, date, odo, title, detail: detail || '' }); }
function setOdo(odo, date){
  S.odo = odo;
  const L = S.odoLog;
  if (L.length && L[L.length-1].date === date) L[L.length-1].odo = odo; else L.push({ date, odo });
  L.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.odo - b.odo);
}
function newPair(id, dot, brand, odo, date){
  return { id, dot: dot || '', brand: brand || '', status: 'front', frontKm: 0, rearKm: 0, posStartOdo: odo, mountDate: date, tread: [], memo: '' };
}
/* 정기/조기 위치교환: 뒤 폐기 → 앞을 뒤로 → 신품을 앞에 */
function doRotate({ odo, date, dot, brand, reason, abnormal }){
  const f = mounted('front'), r = mounted('rear');
  setOdo(odo, date); fold(f); fold(r);
  const ru = used(r);
  r.status = 'scrapped'; r.scrapOdo = odo; r.scrapDate = date; r.scrapReason = reason || '정기 위치교환(수명 도달)';
  f.status = 'rear'; f.posStartOdo = odo;
  const id = nextId(); S.pairs.push(newPair(id, dot, brand, odo, date));
  const det = `${r.id} 폐기(앞 ${km(ru.front)} · 뒤 ${km(ru.rear)}) → ${f.id} 뒤로 이동(앞에서 ${km(f.frontKm)} 사용) → 신품 ${id} 앞 장착${dot ? ' (DOT ' + dot + ')' : ''}`;
  logEv(abnormal ? 'abnormal' : 'rotate', date, odo, abnormal ? `비정상 교체(뒤 ${r.id}): ${reason}` : '정기 위치교환', det);
}
/* 일정에 따른 위치교환 (판단 규칙 decide 적용) */
function doEvent({ odo, date, nf = {}, nr = {} }){
  const f = mounted('front'), r = mounted('rear');
  setOdo(odo, date); fold(f); fold(r);
  const d = decide(f, r, odo);
  const usage = p => `앞 ${km(p.frontKm)} · 뒤 ${km(p.rearKm)}`;
  const scrap = p => { p.status = 'scrapped'; p.scrapOdo = odo; p.scrapDate = date; p.scrapReason = '정기 위치교환(수명 도달)'; };
  if (d.fTo === 'scrap') scrap(f); else { f.status = d.fTo; f.posStartOdo = odo; }
  if (d.rTo === 'scrap') scrap(r); else { r.status = d.rTo; r.posStartOdo = odo; }
  let nfId = null, nrId = null;
  if (d.newFront){ nfId = nextId(); S.pairs.push(newPair(nfId, nf.dot, nf.brand, odo, date)); }
  if (d.newRear){ nrId = nextId(); const p = newPair(nrId, nr.dot, nr.brand, odo, date); p.status = 'rear'; S.pairs.push(p); }
  const steps = describe(d, f.id, r.id, nfId, nrId);
  const det = steps.join(' → ') + ` · 사용: ${f.id}(${usage(f)}), ${r.id}(${usage(r)})`;
  logEv('rotate', date, odo, d.newFront || d.newRear ? '정기 위치교환' : '위치교환 (앞뒤 맞바꿈)', det);
}
/* 앞 타이어 비정상 교체: 앞만 신품으로, 뒤는 유지 */
function doReplaceFront({ odo, date, dot, brand, reason }){
  const f = mounted('front');
  setOdo(odo, date); fold(f);
  const fu = used(f);
  f.status = 'scrapped'; f.scrapOdo = odo; f.scrapDate = date; f.scrapReason = reason;
  const id = nextId(); S.pairs.push(newPair(id, dot, brand, odo, date));
  logEv('abnormal', date, odo, `비정상 교체(앞 ${f.id}): ${reason}`, `${f.id} 폐기(앞에서 ${km(fu.front)} 사용) → 신품 ${id} 앞 장착${dot ? ' (DOT ' + dot + ')' : ''}. 뒤 ${mounted('rear').id} 유지, 일정 재계산`);
}

function bindSetup(){
  $('#setupForm').onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const odo = Math.round(+f.odo), usedB = Math.round(+f.usedB || 0);
    const err = m => { $('#setupErr').textContent = m; };
    if (!(odo >= 0) || f.odo === '') return err('현재 계기판 km를 입력하세요.');
    for (const k of ['dotA','dotB']) if (f[k] && !dotDate(f[k])) return err(`${k === 'dotA' ? 'A' : 'B'}의 DOT는 주(01~53)+연도 4자리입니다. 예: 3426`);
    const date = f.date || todayStr();
    S = { v: 1, settings: { ...DEF_SETTINGS }, odo, odoLog: [{ date, odo }], lastTreadOdo: odo, pairs: [], events: [] };
    const A = newPair('A', f.dotA, f.brandA, odo, date);
    const B = { ...newPair('B', f.dotB, f.brandB, odo, date), status: 'rear', rearKm: usedB, mountDate: '' };
    S.pairs.push(A, B);
    logEv('setup', date, odo, '기록 시작', `뒤 B: 뒤에서 ${km(usedB)} 사용 · 뒤 ${km(DEF_SETTINGS.stageKm)} 도달(${km(odo + DEF_SETTINGS.stageKm - usedB)})에 앞으로 이동, A는 뒤로 예정`);
    logEv('install', date, odo, '앞 A 신품 장착 (손상으로 교체)', `기존 앞 타이어 손상 → 신품 A 앞 장착${f.dotA ? ' (DOT ' + f.dotA + ')' : ''}. 사용 0 km`);
    save(); tab = 'home'; render();
  };
  document.querySelectorAll('#setupForm [data-act]').forEach(b => b.onclick = () => ACTIONS[b.dataset.act]());
  bindImport();
}

const odoDateFields = (title) => `<div class="grid2">
  <label class="f">날짜<input name="date" type="date" value="${todayStr()}" required></label>

function checkOdo(v){
  const odo = Math.round(+v.odo);
  if (!(odo >= 0) || v.odo === '') return { err: '주행거리를 입력하세요.' };
  if (odo < S.odo) return { err: `현재 기록(${km(S.odo)})보다 작습니다. 잘못 입력했다면 설정 → 되돌리기를 쓰세요.` };
  if (!v.date) return { err: '날짜를 입력하세요.' };
  const lastD = S.odoLog[S.odoLog.length-1].date;
  if (v.date < lastD) return { err: `마지막 기록일(${fmtS(lastD)})보다 이전 날짜입니다.` };
  return { odo };
}
function newTireFields(dn = 'dot', bn = 'brand', id = nextId(), pos = ''){
  return `<div class="grid2"><label class="f">신품 ${id}${pos ? ' (' + pos + ')' : ''} DOT 4자리<input name="${dn}" inputmode="numeric" maxlength="4" placeholder="예: 4226"></label>
  <label class="f">브랜드/모델<input name="${bn}" placeholder="선택"></label></div>`;
}
function checkDot(v){ return v.dot && !dotDate(v.dot) ? 'DOT는 주(01~53)+연도 4자리이며 미래일 수 없습니다. 예: 4226' : null; }

const ACTIONS = {
  odo(){
    openDlg(`<h3>주행거리 입력</h3><div class="small muted">계기판 누적 km. 자주 입력할수록 예상 날짜가 정확해집니다.</div>${odoDateFields()}`, v => {
      const c = checkOdo(v); if (c.err) return c.err;
      const sc = schedule(), before = S.odo;
      snapshot(); setOdo(c.odo, v.date);
      logEv('odo', v.date, c.odo, '주행거리 기록', '');
      // 4만 km 지점을 넘으면 위치교환 화면을 자동으로 연다
      if (sc && before < sc.next && c.odo >= sc.next) setTimeout(() => ACTIONS.rotate(true), 50);
    });
  },
  tread(){
    const f = mounted('front'), r = mounted('rear');
    openDlg(`<h3>트레드 측정</h3><div class="small muted">각 바퀴에서 가장 얕은 홈을 mm로 입력. 비워 둔 칸은 건너뜁니다.</div>
      ${odoDateFields()}
      <div class="box"><b>앞 ${esc(f.id)}</b></div><div class="grid2">
        <label class="f">왼쪽 (mm)<input name="fl" type="number" step="0.1" inputmode="decimal"></label>
        <label class="f">오른쪽 (mm)<input name="fr" type="number" step="0.1" inputmode="decimal"></label></div>
      <div class="box"><b>뒤 ${esc(r.id)}</b></div><div class="grid2">
        <label class="f">왼쪽 (mm)<input name="rl" type="number" step="0.1" inputmode="decimal"></label>
        <label class="f">오른쪽 (mm)<input name="rr" type="number" step="0.1" inputmode="decimal"></label></div>`, v => {
      const c = checkOdo(v); if (c.err) return c.err;
      const val = x => x === '' || x == null ? null : +x;
      const fl = val(v.fl), fr = val(v.fr), rl = val(v.rl), rr = val(v.rr);
      if ([fl,fr,rl,rr].every(x => x == null)) return '측정값을 하나 이상 입력하세요.';
      if ([fl,fr,rl,rr].some(x => x != null && (x < 0 || x > 15))) return '0~15mm 사이로 입력하세요.';
      snapshot(); setOdo(c.odo, v.date);
      const parts = [];
      [[f, fl, fr, '앞'], [r, rl, rr, '뒤']].forEach(([p, l, rt, nm]) => {
        const xs = [l, rt].filter(x => x != null); if (!xs.length) return;
        const mm = Math.min(...xs);
        p.tread.push({ date: v.date, odo: c.odo, l, r: rt, mm });
        parts.push(`${nm} ${p.id}: ${l ?? '-'} / ${rt ?? '-'} mm${mm <= st().treadLimit ? ' ⚠ 교체 기준 이하' : ''}`);
      });
      S.lastTreadOdo = c.odo;
      logEv('tread', v.date, c.odo, '트레드 측정', parts.join(' · '));
    });
  },
  rotate(auto){
    const f = mounted('front'), sc = schedule(), plan0 = sc.plan[0];
    if (S.odo < sc.next){
      // 4만 km 전: 실행하지 않고 남은 거리만 안내
      const d = $('#dlg');
      d.innerHTML = `<form method="dialog"><h3>아직 위치교환 시점이 아닙니다</h3>
        <div class="box"><b>${km(sc.next)}</b>에 실행합니다 — ${esc(sc.reason)}.<br>
        남은 거리 <b>${km(sc.next - S.odo)}</b> · 예상 ${fmtD(estDate(sc.next))}</div>
        <div class="small muted" style="margin-top:10px">주행거리를 입력해 ${km(sc.next)} 이상이 되면 위치교환 화면이 자동으로 열립니다. 손상·트레드 ${st().treadLimit.toFixed(1)}mm 이하·연식 초과로 먼저 바꿔야 하면 '비정상 교체'를 쓰세요.</div>
        <div class="btns"><button type="button" id="dlgCancel">닫기</button><button type="button" class="danger" id="goAbn">비정상 교체</button></div></form>`;
      $('#dlgCancel').onclick = () => d.close();
      $('#goAbn').onclick = () => { d.close(); ACTIONS.abnormal(); };
      d.showModal();
      return;
    }
    openDlg(`<h3>위치교환 실행</h3>
      ${auto ? `<div class="alert bad" style="margin-top:8px"><span class="ic">!</span><div><b>위치교환 시점입니다</b><span class="d">${esc(sc.reason)}</span><span class="d">타이어점에서 교환한 뒤 기록하세요. 아직 안 했다면 취소하고, 교환 후 '위치교환 실행'을 누르세요.</span></div></div>` : ''}
      <div class="box">순서<ol>${plan0.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>${plan0.newCount ? '' : '<div class="small muted">폐기·신품 없이 앞뒤만 맞바꿉니다.</div>'}</div>
      ${odoDateFields('교환 시 계기판 (km)')}
      ${plan0.d.newFront ? newTireFields('dot', 'brand', nextId(), '앞') : ''}
      ${plan0.d.newRear ? newTireFields('dotR', 'brandR', nextId(plan0.d.newFront ? 1 : 0), '뒤') : ''}`, v => {
      const c = checkOdo(v); if (c.err) return c.err;
      if (c.odo < sc.next) return `위치교환은 ${km(sc.next)} 이상에서 기록합니다 (${sc.reason}).`;
      const de = checkDot(v) || checkDot({ dot: v.dotR }); if (de) return de;
      snapshot();
      doEvent({ odo: c.odo, date: v.date, nf: { dot: v.dot, brand: v.brand }, nr: { dot: v.dotR, brand: v.brandR } });
      toast('위치교환을 기록했습니다');
    });
  },
  abnormal(){
    const f = mounted('front'), r = mounted('rear');
    openDlg(`<h3>비정상 교체</h3><div class="small muted">펑크·손상·편마모·트레드/연식 기준 초과 등. 일정은 자동으로 다시 계산됩니다.</div>
      <label class="f">교체할 위치<select name="pos" id="absPos">
        <option value="front">앞 ${esc(f.id)} — 앞만 신품으로 교체 (뒤 ${esc(r.id)} 유지)</option>
        <option value="rear">뒤 ${esc(r.id)} — 폐기 후 앞 ${esc(f.id)}를 뒤로, 신품을 앞에</option>
      </select></label>
      <label class="f">사유 (필수)<input name="reason" required placeholder="예: 사이드월 손상"></label>
      ${odoDateFields()}${newTireFields()}
      <div class="small muted" style="margin-top:8px">규칙상 신품은 항상 앞에 장착합니다.</div>`, v => {
      const c = checkOdo(v); if (c.err) return c.err;
      if (!v.reason || !v.reason.trim()) return '사유를 입력하세요.';
      const de = checkDot(v); if (de) return de;
      snapshot();
      if (v.pos === 'front') doReplaceFront({ odo: c.odo, date: v.date, dot: v.dot, brand: v.brand, reason: v.reason.trim() });
      else doRotate({ odo: c.odo, date: v.date, dot: v.dot, brand: v.brand, reason: v.reason.trim(), abnormal: true });
      toast('교체를 기록하고 일정을 다시 계산했습니다');
    });
  },
  undo,
  export(){
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const name = `tire-backup-${todayStr()}.json`;
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: '타이어 수첩 백업' }).catch(() => {});
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  import(){ $('#importFile').click(); },
  reset(){
    if (!confirm('모든 기록을 지웁니다. 백업을 내보냈나요?')) return;
    snapshot(); S = null; try{ localStorage.removeItem(KEY); }catch(e){} render();
  }
};
function bindImport(){
  const inp = $('#importFile'); if (!inp) return;
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    try{
      const d = JSON.parse(await file.text());
      if (!d || !Array.isArray(d.pairs) || !Array.isArray(d.events) || typeof d.odo !== 'number') throw 0;
      if (S) snapshot();
      S = d; S.settings = Object.assign({}, DEF_SETTINGS, S.settings || {}); dropScrapAt();
      save(); tab = 'home'; render(); toast('백업을 불러왔습니다');
    }catch(e){ toast('올바른 백업 파일이 아닙니다'); }
    inp.value = '';
  };
}
function editPair(id){
  const p = S.pairs.find(x => x.id === id);
  openDlg(`<h3>쌍 ${esc(p.id)} 수정</h3>
    <div class="grid2"><label class="f">DOT 4자리<input name="dot" inputmode="numeric" maxlength="4" value="${esc(p.dot)}"></label>
    <label class="f">브랜드/모델<input name="brand" value="${esc(p.brand)}"></label></div>
    <div class="grid2"><label class="f">앞에서 사용 (km)<input name="fk" type="number" inputmode="numeric" value="${Math.round(used(p).front)}"></label>
    <label class="f">뒤에서 사용 (km)<input name="rk" type="number" inputmode="numeric" value="${Math.round(used(p).rear)}"></label></div>
    <label class="f">메모<input name="memo" value="${esc(p.memo)}"></label>`, v => {
    if (v.dot && !dotDate(v.dot)) return 'DOT는 주(01~53)+연도 4자리입니다.';
    const fk = Math.round(+v.fk || 0), rk = Math.round(+v.rk || 0);
    if (fk < 0 || rk < 0) return '0 이상으로 입력하세요.';
    snapshot();
    p.dot = v.dot || ''; p.brand = v.brand || ''; p.memo = v.memo || '';
    p.frontKm = fk; p.rearKm = rk; p.posStartOdo = S.odo; // 보정값을 현재 시점 기준으로 다시 잡음
    logEv('edit', todayStr(), S.odo, `쌍 ${p.id} 정보 수정`, `DOT ${p.dot || '-'} · 앞 ${km(fk)} · 뒤 ${km(rk)}`);
  });
}
function bindView(){
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => ACTIONS[b.dataset.act]());
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editPair(b.dataset.edit));
  const sf = $('#setForm');
  if (sf) sf.onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(sf)); const n = {};
    for (const k in DEF_SETTINGS){ const x = +v[k]; if (!(x > 0)) return toast('0보다 큰 값을 입력하세요'); n[k] = x; }
    if (n.treadCaution < n.treadLimit) return toast('주의 기준은 교체 기준 이상이어야 합니다');
    if (n.dotCaution > n.dotWarn) return toast('연식 주의는 교체 연수 이하여야 합니다');
    snapshot(); S.settings = n; save(); render(); toast('저장했습니다');
  };
  bindImport();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); });

/* ================= 아이콘 · 매니페스트 (단일 파일용으로 실행 중 생성) ================= */
(function makeIcons(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#1f2937'; g.fillRect(0,0,180,180);
    g.translate(90,90);
    g.fillStyle = '#0b0f14'; g.beginPath(); g.arc(0,0,66,0,Math.PI*2); g.fill();
    g.strokeStyle = '#374151'; g.lineWidth = 6;
    for (let i = 0; i < 24; i++){ g.save(); g.rotate(i*Math.PI/12); g.beginPath(); g.moveTo(0,-64); g.lineTo(0,-52); g.stroke(); g.restore(); }
    g.fillStyle = '#9ca3af'; g.beginPath(); g.arc(0,0,40,0,Math.PI*2); g.fill();
    g.fillStyle = '#4ade80'; g.beginPath(); g.arc(0,0,18,0,Math.PI*2); g.fill();
    g.fillStyle = '#0b0f14'; g.font = 'bold 22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('⚡',0,1);
    const png = c.toDataURL('image/png');
    const addLink = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    addLink('apple-touch-icon', png);
    const base = location.href.split('#')[0];
    const man = { name: '타이어 수첩', short_name: '타이어', lang: 'ko', display: 'standalone', start_url: base, scope: base.replace(/[^/]*$/, ''),
      background_color: '#111418', theme_color: '#111418', icons: [{ src: png, sizes: '180x180', type: 'image/png' }] };
    addLink('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)));
  }catch(e){}
})();

render();
</script>
